[project]
name = "CJ-DocGuard 自建健康样本"
sources = ["src"]
documents = ["README.md"]
output = ".docguard"
trusted = true
closed_inputs = true

[[sdks]]
version = "1.1.3"

[[sdks]]
version = "1.2.0"

[[examples]]
id = "arithmetic"
file = "programs/arithmetic.cj"
symbol = "add"
kind = "program"
mode = "run"
sdks = ["1.1.3", "1.2.0"]
stdout = "42\n"
expected_exit = 0
timeout_ms = 10000
required = true

